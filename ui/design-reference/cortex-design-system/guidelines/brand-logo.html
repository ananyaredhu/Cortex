<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;box-sizing:border-box}*{box-sizing:border-box}.m{font:var(--type-mono);color:var(--text-muted)}</style></head><body><div style="display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px;height:180px">
 <div style="background:var(--paper);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;gap:12px"><img src="../assets/logo/cortex-mark.svg" style="width:56px;height:56px"><span style="font:600 48px/1 var(--font-serif);letter-spacing:-.02em">cortex</span></div>
 <div style="background:var(--ink);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;gap:10px"><div style="width:56px;height:56px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center"><img src="../assets/logo/cortex-mark.svg" style="width:44px;height:44px"></div><span style="font:600 34px/1 var(--font-serif);color:var(--paper);letter-spacing:-.02em">cortex</span></div>
