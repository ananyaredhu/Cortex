<!-- @dsCard group="Colors" viewport="700x170" subtitle="Warm paper and ink — the base of every surface" name="Neutrals" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;box-sizing:border-box}*{box-sizing:border-box}.m{font:var(--type-mono);color:var(--text-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px"><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:64px;border-radius:var(--radius-md);background:var(--paper);border:1px solid var(--border-subtle)"></div><div style="font-size:13px;font-weight:700">Paper</div><div class="m">--paper<br>#F4F3F0</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:64px;border-radius:var(--radius-md);background:var(--paper-2);border:1px solid var(--border-subtle)"></div><div style="font-size:13px;font-weight:700">Paper 2</div><div class="m">--paper-2<br>#E9E7E2</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:64px;border-radius:var(--radius-md);background:var(--white);border:1px solid var(--border-subtle)"></div><div style="font-size:13px;font-weight:700">Card</div><div class="m">--white<br>#FFFFFF</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:64px;border-radius:var(--radius-md);background:var(--gray-200);border:1px solid var(--border-subtle)"></div><div style="font-size:13px;font-weight:700">Line</div><div class="m">--gray-200<br>#E6E3DD</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:64px;border-radius:var(--radius-md);background:var(--gray-500);"></div><div style="font-size:13px;font-weight:700">Muted</div><div class="m">--gray-500<br>#6B6862</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:64px;border-radius:var(--radius-md);background:var(--ink);"></div><div style="font-size:13px;font-weight:700">Ink</div><div class="m">--ink<br>#141414</div></div></div></body></html>
