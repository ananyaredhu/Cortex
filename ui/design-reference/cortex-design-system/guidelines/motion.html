<!-- @dsCard group="Spacing" viewport="700x130" subtitle="Quick, eased-out; no bounce" name="Motion" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;box-sizing:border-box}*{box-sizing:border-box}.m{font:var(--type-mono);color:var(--text-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px"><div style="background:var(--white);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:14px"><div style="font-weight:700;font-size:20px">120ms</div><div class="m">--dur-fast</div><div style="font-size:13px;color:var(--text-body);margin-top:6px">hover, press</div></div><div style="background:var(--white);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:14px"><div style="font-weight:700;font-size:20px">180ms</div><div class="m">--dur-base</div><div style="font-size:13px;color:var(--text-body);margin-top:6px">menus, toasts, tabs</div></div><div style="background:var(--white);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:14px"><div style="font-weight:700;font-size:20px">320ms</div><div class="m">--dur-slow</div><div style="font-size:13px;color:var(--text-body);margin-top:6px">dialogs, graph reveal</div></div></div><div class="m" style="margin-top:12px">--ease-out cubic-bezier(.2,.7,.2,1) · press = translateY(1px)</div></body></html>
