<!-- @dsCard group="Colors" viewport="700x170" subtitle="Status colors share one lightness/chroma" name="Semantic" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;box-sizing:border-box}*{box-sizing:border-box}.m{font:var(--type-mono);color:var(--text-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px"><div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;height:64px;border-radius:var(--radius-md);overflow:hidden"><div style="flex:1;background:var(--green)"></div><div style="flex:1;background:var(--green-100)"></div></div><div style="font-size:13px;font-weight:700">Success</div><div class="m">--green / --green-100</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;height:64px;border-radius:var(--radius-md);overflow:hidden"><div style="flex:1;background:var(--red)"></div><div style="flex:1;background:var(--red-100)"></div></div><div style="font-size:13px;font-weight:700">Danger</div><div class="m">--red / --red-100</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;height:64px;border-radius:var(--radius-md);overflow:hidden"><div style="flex:1;background:var(--blue)"></div><div style="flex:1;background:var(--blue-100)"></div></div><div style="font-size:13px;font-weight:700">Info</div><div class="m">--blue / --blue-100</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;height:64px;border-radius:var(--radius-md);overflow:hidden"><div style="flex:1;background:var(--amber)"></div><div style="flex:1;background:var(--amber-100)"></div></div><div style="font-size:13px;font-weight:700">Warning</div><div class="m">--amber / --amber-100</div></div></div></body></html>
