<!-- @dsCard group="Colors" viewport="700x170" subtitle="data-theme="dark" swaps aliases; orange stays put" name="Dark theme" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;box-sizing:border-box}*{box-sizing:border-box}.m{font:var(--type-mono);color:var(--text-muted)}</style></head><body><div data-theme="dark" style="background:var(--bg-app);border-radius:var(--radius-lg);padding:18px"><div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px"><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:64px;border-radius:var(--radius-md);background:var(--bg-app);"></div><div style="font-size:13px;font-weight:700;color:var(--text-strong)">App</div><div class="m">--bg-app<br>#141414</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:64px;border-radius:var(--radius-md);background:var(--surface-card);"></div><div style="font-size:13px;font-weight:700;color:var(--text-strong)">Card</div><div class="m">--surface-card<br>#1E1D1B</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:64px;border-radius:var(--radius-md);background:var(--border-subtle);"></div><div style="font-size:13px;font-weight:700;color:var(--text-strong)">Line</div><div class="m">--border-subtle<br>#2F2E2B</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:64px;border-radius:var(--radius-md);background:var(--text-muted);"></div><div style="font-size:13px;font-weight:700;color:var(--text-strong)">Muted</div><div class="m">--text-muted<br>#A19D95</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:64px;border-radius:var(--radius-md);background:var(--text-strong);"></div><div style="font-size:13px;font-weight:700;color:var(--text-strong)">Ink</div><div class="m">--text-strong<br>#F4F3F0</div></div></div></div></body></html>
