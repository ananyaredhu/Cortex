name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Postgres with pgvector, so the database tests run in CI instead of being skipped (fix F8). Each test makes its own throwaway
    # schema from db/init.sql, so nothing here needs seeding.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: brain
          POSTGRES_PASSWORD: brain
          POSTGRES_DB: brain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://brain:brain@localhost:5432/brain
      REQUIRE_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Contract and golden tests
        run: python -m pytest
      - name: Fixtures are up to date
        run: |
          python fixtures/generate.py
          git diff --exit-code fixtures/company_a.json

  # The UI (ui/): type-check, unit tests and a production build. The Playwright suite (npm run e2e) needs a 700 MB browser
  # and runs by hand for now. Node 22 is the version the team's setup guide (docs/setup-ui-laptop.md) installs.
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
